org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# 真机测试结束后不卸载 App:卸载会丢失无线调试配对(钥匙存在 App 里)和无障碍授权,每次都得重新配对
android.injected.androidTest.leaveApksInstalledAfterRun=true

# AGP 8.7.3 officially tests up to compileSdk 35; the dependency set needs 36.
# Remove this line when AGP is upgraded to a version that supports API 36.
android.suppressUnsupportedCompileSdk=36
