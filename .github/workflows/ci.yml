name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
  NO_PROXY: 127.0.0.1,localhost,::1
  no_proxy: 127.0.0.1,localhost,::1
  TZ: UTC

jobs:
  flutter-checks:
    name: flutter (format / analyze / widgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos
      - name: Widget and theme tests
        run: flutter test --no-pub --concurrency=2 --reporter=expanded --file-reporter=json:build/test-results/flutter.json --test-randomize-ordering-seed=20261111
      - name: Upload Flutter test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results
          path: flutter/build/test-results/
          if-no-files-found: ignore

  jvm-tests:
    name: core (JVM tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/test/
          if-no-files-found: ignore

  # Build and Android tests share one prebuilt debug AAR.
  android-debug:
    name: android (:app:assembleDebug)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform and build-tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Flutter debug AAR
        working-directory: flutter
        run: flutter build aar --debug --no-profile --no-release
      - name: Android unit tests and app / device test APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace -PskipFlutterAar
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 30 秒，纯 Python 标准库：守住 Apache-2.0 §4 归属与第三方披露。
  compliance:
    name: compliance (attribution)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/maeve/check_compliance.py

  # Slower auxiliary checks remain available on demand.
  full-checks:
    name: full checks (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: i18n checks
        run: |
          python3 -m unittest discover -s tools/i18n -v
          python3 tools/i18n/translations.py check
      - name: CLI tests
        run: |
          python3 -m unittest discover -s tools/maeve-cli/tests -v
