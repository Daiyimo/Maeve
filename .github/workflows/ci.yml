name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
  NO_PROXY: 127.0.0.1,localhost,::1

jobs:
  core:
    name: core (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test --no-daemon --stacktrace

  cli-python:
    name: cli (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translation tool tests
        run: python3 -m unittest discover -s tools/i18n -v
      - name: Translation resource check
        run: python3 tools/i18n/translations.py check

  flutter:
    name: flutter (format / analyze / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: android (:app assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platforms
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;25.1.8937393"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Flutter debug AAR
        working-directory: flutter
        run: flutter build aar --debug
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -PskipFlutterAar
