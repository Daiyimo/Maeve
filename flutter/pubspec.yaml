name: maeve_flutter
description: "Maeve's Flutter UI shell, embedded in the Android :app module."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 只打包等宽字体 JetBrains Mono(OFL,3 个字重共 ~0.8MB)。
  # 中文字体不打包:跟随系统(Roboto + 系统中文字体)。
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  # Flutter module metadata. These identifiers let the tooling keep assets and
  # plugins consistent; the Android host keeps its own application id.
  module:
    androidX: true
    androidPackage: com.daiyimo.maeve_flutter
    iosBundleIdentifier: com.daiyimo.maeveFlutter
