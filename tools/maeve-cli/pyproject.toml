[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maeve-phone-cli"
version = "0.1.0"
description = "Command-line client for Maeve's Android task API"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
maeve = "maeve_cli:main"

[tool.setuptools]
py-modules = ["maeve_cli"]
packages = ["maeve_desk"]
package-dir = {"" = "scripts"}

[tool.setuptools.package-data]
maeve_desk = ["*.html", "*.css", "*.js", "maeve-logo.png"]
